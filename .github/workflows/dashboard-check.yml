name: dashboard-check
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Полная проверка SDK и браузерных действий
        timeout-minutes: 15
        env:
          DK_EVIDENCE_DIR: artifacts
        run: python3 tools/test.py
      - name: Проверка протокола MCP
        run: |
          python3 -m pip install -r tools/mcp-requirements.txt
          python3 tools/check-mcp.py
      - name: Сохранить проверяемые результаты runtime
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-runtime-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
