name: dashboard-check
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Проверка дизайн-системы (без браузерной части)
        run: python3 tools/check.py --fast
      - name: Регрессия поиска в Chrome
        run: node tools/check-select.mjs
