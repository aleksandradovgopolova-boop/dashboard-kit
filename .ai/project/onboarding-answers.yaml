# Ответы владельца на вопросы онбординга AI Ops.
#
# Здесь только то, что из кода честно не выводится: цели продукта, его пользователи,
# границы, которые нельзя нарушать. Кит эти вещи не выдумывает — поэтому спрашивает.
#
# Как отвечать: впишите значение после двоеточия. Пустая строка означает «ещё не ответил»,
# и вопрос останется. Ответ сильнее любого вывода кита: он становится подтверждённым фактом
# (`user_confirmed`) и больше не переспрашивается.
#
# После заполнения запустите снова:  ./ai-ops model
answers:
  # Кто основной пользователь продукта?
  primary_user: ""

  # Какую главную проблему продукт должен решать?
  main_problem: ""

  # Какие 2–3 пользовательских сценария сейчас самые важные?
  key_scenarios: ""

  # Какая главная цель продукта сейчас?
  main_goal_now: ""

  # Что должно стать следующим крупным результатом для пользователя?
  next_outcome: ""

  # Какие важные допущения продукта пока не проверены?
  known_assumptions: ""

  # Есть ли данные, которые нельзя отправлять внешним AI-провайдерам?
  sensitive_data: ""

  # Есть ли действия, которые AI никогда не должен выполнять без подтверждения?
  forbidden_without_approval: ""

  # Какие пути нельзя менять без ревью владельца?
  protected_paths: ""

  # Какой environment считается production?
  #   по коду предполагаю: окружение, куда деплоит существующий конвейер — подтвердите или замените
  production_env: ""

  # Может ли AI самостоятельно создавать PR или только готовить изменения локально?
  pr_autonomy: ""

  # По какой метрике будет видно, что следующий результат удался?
  success_metric: ""
