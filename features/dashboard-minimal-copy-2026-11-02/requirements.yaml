schema_version: 1
kind: requirements-artifact
workitem_id: dashboard-minimal-copy-2026-11-02
source: implementation-plan.md
requirements:
  - id: R1
    statement: Обычный рабочий экран показывает данные, названия, единицы, короткий контекст, статусы и действия без постоянных поясняющих предложений.
    acceptance:
      - При полном наборе данных обзор содержит необходимые значения и подписи, но не выводит пустую строку или контрол для отсутствующего пояснения.
      - Смысл основного показателя и короткий статус читаются без открытия подсказки; формула и развёрнутое объяснение открываются по запросу.
  - id: R2
    statement: Пояснения используют существующий dkTooltip либо существующие детали/диалог и доступны мышью, клавиатурой и нажатием.
    acceptance:
      - Короткое пояснение открывается наведением, фокусом и нажатием; Escape закрывает его, не оставляя потерянного фокуса.
      - Интерактивное или длинное содержимое располагается в деталях/диалоге; tooltip не содержит ссылок или действий.
      - Закрытие и повторное открытие деталей не оставляют лишних tooltip и обработчиков; пояснение соответствует текущему срезу.
  - id: R3
    statement: Отсутствие оценки и частичное покрытие сохраняют видимый короткий статус и доступные по запросу причины, отличаясь от нуля.
    acceptance:
      - При отсутствующем наблюдении виден короткий статус, а пояснение сообщает о неполном покрытии и отличии отсутствия данных от нуля.
      - При полном покрытии и нулевом знаменателе оценка отсутствует по прежним правилам, а причина доступна по запросу.
      - После перехода полный → partial/missing → полный, в том числе через фильтр, исчезают устаревшее пояснение, контрол и занятое ими место.
      - Региональные детали сохраняют доступ к причине отсутствия значения; пустой результат предлагает действующее восстановление.
  - id: R4
    statement: Постоянная мобильная инструкция перемещения карты удалена, а перемещение карты и переход в список остаются доступны.
    acceptance:
      - На мобильной ширине карта прокручивается действием и переключается в список; переключатели имеют доступные названия.
      - Проверка touch-эмуляции не заявляется проверкой физического устройства.
  - id: R5
    statement: Редакционное изменение сохраняет расчёты, метрики, фильтры, URL state и Graphite Dark/Light.
    acceptance:
      - Существующие проверки ипотечных расчётов и связности среза проходят после изменения; новые формулы и метрики не добавлены.
      - Обе темы сохраняют принятые компоненты и токены; новые placeholder-слоты под отсутствующий текст не появляются.
  - id: R6
    statement: Канонические правила, продуктовая UI/UX-политика, dashboard-build и генерируемый справочник выражают одно принятое правило минимального текста.
    acceptance:
      - Правила не требуют постоянных пояснений в обычном состоянии и отличают их от коротких названий, единиц и статусов.
      - Учебная документация и согласованный вводный текст вне рабочего экрана не подвергаются массовой редактуре.
      - Результаты проверок фиксируются на окончательной версии; пропуски, touch-эмуляция и непроверенные физические устройства обозначаются честно.
